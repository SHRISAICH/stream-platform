services:
  postgres:
    image: postgres:16
    container_name: stream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-stream_user}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-stream_password}
      POSTGRES_DB: stream_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stream-network

  redis:
    image: redis:7-alpine
    container_name: stream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stream-network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    container_name: stream-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stream-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: stream-backend:latest
    container_name: stream-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stream_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-stream_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-stream_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SRS_API_URL: http://srs:1985
      SRS_PLAYBACK_URL_PREFIX: ${SRS_PLAYBACK_URL_PREFIX:-/live}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin12345}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-stratalive-videos}
      JWT_SECRET: ${JWT_SECRET:-mySuperSecretKeyForJwtAuthentication123456789}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - stream-network

  srs:
    image: ossrs/srs:5
    container_name: stream-srs
    restart: unless-stopped
    command: ./objs/srs -c conf/srs.conf
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
    volumes:
      - ./infrastructure/srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
      - ./infrastructure/srs/srs.conf:/usr/local/srs/conf/docker.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - stream-network

  nginx:
    image: nginx:latest
    container_name: stream-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      srs:
        condition: service_started
    networks:
      - stream-network

volumes:
  postgres_data:
  minio_data:

networks:
  stream-network:
    driver: bridge