spring.application.name=stream-api

# Server
server.port=8081

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stream_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stream_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stream_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# SRS
srs.api.url=${SRS_API_URL:http://localhost:1985}
srs.playback.url-prefix=${SRS_PLAYBACK_URL_PREFIX:http://localhost:8080/live}

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Security Debug Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.streamplatform.streamapi.security=DEBUG

# JWT
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJwtAuthentication123456789}

# MinIO
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:admin12345}
minio.bucket-name=${MINIO_BUCKET_NAME:stratalive-videos}

# Multipart File Upload (up to 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB